### OPTIONS ###

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using \ and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file 
bind r source-file ~/.config/tmux/tmux.conf

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# scratchpad popup
bind -n C-i if-shell -F '#{==:#{session_name},scratch}' \
    'detach-client' \
    'display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s scratch"'
set-hook -g session-created 'if-shell -F "#{==:#{session_name},scratch}" "set -t scratch status off"'

# Fuzzy jump to any window across any session
bind C-j display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index} - #{window_name}' | fzf --reverse | cut -d ' ' -f 1 | xargs tmux select-window -t"

set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1

# enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# instant escape for nvim
set -s escape-time 0

# vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# renumber windows when one is closed  
set -g renumber-windows on

# move bar to top
set -g status-position top  

### DESIGN TWEAKS ###

# don't do anything when a 'bell' rings
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
set -as terminal-features ",xterm-256color*:RGB"
set -g default-terminal "tmux-256color"
# Enable undercurl and colored underlines
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# clock mode
setw -g clock-mode-colour colour1

# copy mode
setw -g mode-style 'fg=colour1 bg=colour18 bold'
set -g @thumbs-osc52 1

# pane borders
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'

# required image rendering settings
set -gq allow-passthrough on  
set -g visual-activity off

### TOKYONIGHT COLORS ###

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

### BAR ###
# source-file ~/.config/tmux/snazzy.theme
source-file ~/.config/tmux/vague.theme
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

### PLUGINS ###

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin "janoamaral/tokyo-night-tmux"

set -g @plugin 'Morantron/tmux-fingers'

run '~/.tmux/plugins/tpm/tpm'
